name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs dpkg-dev

      - uses: actions/checkout@v4

      - name: Run all unit tests
        run: sh tests/run-tests.sh
