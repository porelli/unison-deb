name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: upstream version to build (e.g. 2.54.0)
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            image: debian:trixie
            runner: ubuntu-latest
          - suite: resolute
            image: ubuntu:26.04
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install git and nodejs for checkout
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs

      - uses: actions/checkout@v4

      - name: Build
        run: sh scripts/build-debs.sh "${{ inputs.version }}" "${{ matrix.suite }}" "$PWD/out"

      - name: Build the keyring package
        run: |
          set -eux
          apt-get install -y --no-install-recommends gnupg
          sh scripts/make-keyring-deb.sh "${{ matrix.suite }}" packaging/keys/unison-deb.asc "$PWD/out"

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-amd64
          path: out/*.deb

  repo:
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates dpkg-dev apt-utils gnupg nodejs

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: incoming

      - name: Lay out the pool
        run: |
          set -eux
          for d in incoming/debs-*; do
            suite="$(basename "$d" | cut -d- -f2)"
            mkdir -p "repo/pool/$suite/main/u/unison"
            cp "$d"/*.deb "repo/pool/$suite/main/u/unison/"
          done
          find repo -name '*.deb' | sort

      - name: Build the keyring packages and the bootstrap tree
        run: |
          set -eux
          # shellcheck source=scripts/lib.sh
          . scripts/lib.sh
          for suite in $(suite_list); do
            mkdir -p "repo/bootstrap/$suite" "repo/pool/$suite/main/u/unison"
            sh scripts/make-keyring-deb.sh "$suite" packaging/keys/unison-deb.asc "repo/bootstrap/$suite"
            cp "repo/bootstrap/$suite"/*.deb "repo/pool/$suite/main/u/unison/"
          done
          cp packaging/keys/unison-deb.asc repo/unison-deb.asc
          find repo/bootstrap -type f | sort

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}' > keyid.txt
          [ -s keyid.txt ] || { echo "error: APT_SIGNING_KEY secret is empty or invalid" >&2; exit 1; }
          echo "imported $(cat keyid.txt)"

      - name: Assemble and sign
        run: sh scripts/make-repo.sh "$PWD/repo" "$(cat keyid.txt)" amd64

      - name: Test multiversion indexing
        run: sh tests/test-multiversion.sh repo/pool/trixie/main/u/unison/unison_*.deb

      - name: Verify keyring in indices
        run: |
          set -eux
          for suite in trixie resolute; do
            echo "=== $suite/amd64 Packages (keyring entries) ==="
            grep -A5 "^Package: unison-deb-keyring$" "repo/dists/$suite/main/binary-amd64/Packages" || echo "MISSING"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: repo

  install-test:
    needs: repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            image: debian:trixie
            runner: ubuntu-latest
          - suite: resolute
            image: ubuntu:26.04
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install nodejs for checkout
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: repo

      - name: Install from the repository and sync for real
        run: |
          set -eu
          version="$(sh scripts/deb-version.sh "${{ inputs.version }}" "${{ matrix.suite }}")"
          sh scripts/install-test.sh "$PWD/repo" "${{ matrix.suite }}" "$version"
